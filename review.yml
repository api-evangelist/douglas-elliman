actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectoryCreated: false
  specsSaved: 0
  reason: >-
    apis[] is deliberately empty and openapi/ is deliberately omitted. Douglas Elliman publishes
    no documented API and serves no machine-readable contract. Recording the private 403 host at
    api.elliman.com or the site's undocumented internal XHR calls as APIs would be fabrication.
    Absence is recorded as the finding.
