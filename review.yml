sources:
- url: https://www.elliman.com/about-us
  type: About
  note: >-
    Company scale and structure — ~$39.8B in sales, $25B in new development, ~6K agents in key
    luxury markets; CEO Michael S. Liebowitz; markets CA, CO, CT, FL, MA, Mid-Atlantic, NV, NJ,
    NY, NYC, TX, VT, France, Monaco; brand portfolio includes New Development, Commercial,
    Relocation, Sports & Entertainment, Farm & Ranch, Title Services, Elliman Yachts.
- url: https://investors.elliman.com/
  type: InvestorRelations
  note: NYSE DOUG; founded 1911; ~46,000 annual sales and rental transactions; ~$29.6B volume.
- url: https://www.reso.org/membership/
  type: Standards
  note: Douglas Elliman Real Estate listed as a RESO Class D member (Brokers, Agents, Appraisers).
- url: https://www.reso.org/certificates/
  type: Standards
  note: RESO certified-organizations directory — Douglas Elliman absent (0 matches in 416KB).
- url: https://github.com/DouglasElliman/RetsConnector
  type: SourceCode
