name: Douglas Elliman
kind: company
description: >-
  Douglas Elliman Inc. (NYSE: DOUG) is a residential real estate brokerage founded
  in 1911 and headquartered at 575 Madison Avenue, New York City. It is one of the
  largest brokerages in the New York metropolitan area and among the largest in the
  United States, with roughly 6,000 agents across New York, Florida, California,
  Texas, Colorado, Massachusetts, Connecticut, Nevada, New Jersey, Vermont, the
  Mid-Atlantic, and international outposts in France and Monaco. Its home market is
  the United States. In the value chain Douglas Elliman sits on the SELL side as a
  licensed brokerage and MLS participant — it consumes MLS listing data under IDX
  and broker agreements rather than originating a syndicated feed — and it extends
  into development marketing, property management, commercial brokerage, title and
  escrow (Douglas Elliman Title), relocation, and PropTech venture investment through
  New Valley Ventures. Its API posture is honest and thin: no developer portal, no
  published API documentation, no OpenAPI or OData $metadata contract, and no
  published access path of any kind. developer.elliman.com, developers.elliman.com,
  and docs.elliman.com all resolve to the marketing homepage via a wildcard catch-all
  rather than to a portal, and api.elliman.com exists as an IIS/ASP.NET host that
  returns HTTP 403 at its root with no documentation behind it. On RESO, Douglas
  Elliman Real Estate is listed as a Class D member (Brokers, Agents and Appraisers)
  on the RESO membership roster but does NOT appear in the RESO certified-organizations
  directory — it is a RESO member, not a RESO-certified data provider, and it publishes
  no Web API or Data Dictionary certification, no OData endpoint, and no UPI surface.
  The single public engineering artifact the company ships is a GitHub fork of a
  third-party .NET RETS client library, which is consumer-side evidence that Elliman
  pulls MLS data in rather than producer-side evidence that it exposes any.
