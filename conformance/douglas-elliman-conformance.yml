summary: >-
  Douglas Elliman conforms to no machine-readable API standard on its producer side. It is a
  RESO trade-association member (Class D, Brokers/Agents/Appraisers) but does not appear in
  the RESO certified-organizations directory, publishes no RESO Web API (OData v4) endpoint,
  no $metadata document, no Data Dictionary certification and no UPI. The one standards
  touchpoint is consumer-side: a fork of a third-party .NET RETS client, evidence that the
  brokerage ingests MLS data over the legacy RETS transport rather than exposing anything.
  No Compliance pointer is wired: no certification or compliance program (SOC 2, ISO 27001,
  PCI DSS, HIPAA) is published anywhere on the elliman.com surface.
